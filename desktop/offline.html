<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Cleanup</title>
  <style>
    :root { --bg: #ffffff; --text: #111418; --muted: #5b6470; --accent: #0e7c66; --on-accent: #ffffff; --border: #dde1e6; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111418; --text: #f2f4f6; --muted: #a3acb6; --border: #2c333b; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; padding: 24px; }
    main { max-width: 440px; text-align: center; }
    .mark { width: 56px; height: 56px; border-radius: 14px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; font-size: 28px; margin: 0 auto 20px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 12px; }
    code { font-size: 13px; background: color-mix(in srgb, var(--border) 60%, transparent); padding: 2px 6px; border-radius: 6px; }
    button { margin-top: 12px; height: 44px; padding: 0 22px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">C</div>
    <h1>Cleanup isn't reachable</h1>
    <p id="tried">Tried your local copy and the online site.</p>
    <p>To use your local copy, open Docker, then run <code>npm run db:start</code>, <code>npm run dev -- --port 5320</code> and <code>npm run worker</code> in the cleanup folder. For the online site, check your internet connection.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    const tried = new URLSearchParams(location.search).get("tried");
    if (tried) document.getElementById("tried").textContent = "Tried " + tried + ".";
    document.getElementById("retry").addEventListener("click", async (e) => {
      e.target.disabled = true; e.target.textContent = "Trying…";
      try { await window.cleanupApp.retry(); } finally { e.target.disabled = false; e.target.textContent = "Try again"; }
    });
  </script>
</body>
</html>
